name: Generar datos Power BI
on:
  push:
    paths:
      - 'powerbi/scripts/generar_datos.py'
      - '.github/workflows/generar-datos-powerbi.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar CSV
        run: python powerbi/scripts/generar_datos.py
      - name: Publicar CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add powerbi/data/*.csv
          if ! git diff --cached --quiet; then
            git commit -m "Agregar datasets sinteticos para Power BI"
            git push
          fi
